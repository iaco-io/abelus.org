<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<!-- abelus: a honeybee seen from above, flying up and to the right, over a faint honeycomb on warm night -->
	<defs>
		<radialGradient id="sky" cx="50%" cy="42%" r="70%">
			<stop offset="0" stop-color="#4a3818" />
			<stop offset="1" stop-color="#1c150b" />
		</radialGradient>
		<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f3d488" />
			<stop offset="1" stop-color="#c38f34" />
		</linearGradient>
		<linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fbf4e4" stop-opacity="0.95" />
			<stop offset="1" stop-color="#fbf4e4" stop-opacity="0.55" />
		</linearGradient>
		<pattern id="comb" width="60" height="104" patternUnits="userSpaceOnUse" patternTransform="translate(16 0)">
			<path d="M30 0 60 17v35L30 69 0 52V17ZM30 69v35M0 52l-30 17M60 52l30 17" fill="none" stroke="#d9b56a" stroke-width="2" />
		</pattern>
		<radialGradient id="fade" cx="50%" cy="50%" r="50%">
			<stop offset="0.35" stop-color="#fff" stop-opacity="0" />
			<stop offset="1" stop-color="#fff" stop-opacity="1" />
		</radialGradient>
		<mask id="edges"><rect width="512" height="512" fill="url(#fade)" /></mask>
		<clipPath id="abdomen"><ellipse cx="256" cy="318" rx="66" ry="98" /></clipPath>
	</defs>

	<rect width="512" height="512" fill="url(#sky)" />
	<rect width="512" height="512" fill="url(#comb)" opacity="0.14" mask="url(#edges)" />

	<g transform="rotate(28 256 256)">
		<!-- wings, behind the body -->
		<g fill="url(#wing)" stroke="#e8c97e" stroke-width="4">
			<ellipse cx="178" cy="176" rx="92" ry="44" transform="rotate(-32 178 176)" />
			<ellipse cx="334" cy="176" rx="92" ry="44" transform="rotate(32 334 176)" />
			<ellipse cx="190" cy="232" rx="58" ry="28" transform="rotate(-12 190 232)" opacity="0.85" />
			<ellipse cx="322" cy="232" rx="58" ry="28" transform="rotate(12 322 232)" opacity="0.85" />
		</g>

		<!-- stinger -->
		<path d="M244 408 256 446 268 408Z" fill="#b88a3a" />

		<!-- abdomen with stripes -->
		<ellipse cx="256" cy="318" rx="66" ry="98" fill="url(#gold)" />
		<g clip-path="url(#abdomen)" fill="#2a1f0e">
			<path d="M180 282q76 22 152 0v24q-76 22-152 0Z" />
			<path d="M180 334q76 22 152 0v24q-76 22-152 0Z" />
			<path d="M180 386q76 22 152 0v40H180Z" />
		</g>
		<ellipse cx="232" cy="290" rx="14" ry="34" fill="#fff" opacity="0.18" transform="rotate(-10 232 290)" />

		<!-- thorax, fuzzy and golden on top -->
		<circle cx="256" cy="214" r="50" fill="#3a2a12" />
		<circle cx="256" cy="206" r="36" fill="url(#gold)" opacity="0.9" />

		<!-- head, eyes, antennae -->
		<g fill="none" stroke="#e8c97e" stroke-width="7" stroke-linecap="round">
			<path d="M242 136c-6-30-20-46-40-54" />
			<path d="M270 136c6-30 20-46 40-54" />
		</g>
		<circle cx="200" cy="81" r="9" fill="#e8c97e" />
		<circle cx="312" cy="81" r="9" fill="#e8c97e" />
		<circle cx="256" cy="156" r="32" fill="#2a1f0e" />
		<ellipse cx="236" cy="150" rx="9" ry="14" fill="#5a4320" />
		<ellipse cx="276" cy="150" rx="9" ry="14" fill="#5a4320" />
	</g>
</svg>
